# phpwcms nginx configuration (examples)

#include mime.types;
#types {
    # here are additional types
    #video/ogg ogv
    #video/ogg ogg
    #video/webm webm
#}

index index.html index.php;

# All 404 error should link to phpwcms then
# it is easy to define internal routing/redirection
#   error_page 404 /index.php?r404;
# Installed in Subfolder www.example.com/subfolder/
#   error_page 404 /subfolder/index.php?r404;

# Avoid accessing hidden files and directories
location ~ /\.(?!well-known) {
  return 404;
}

location ~ ^/upload {
  deny all;
}

# filearchive/ is private by default and serves the direct-download option
# of file list content parts only after removing this block and adding
# filearchive to the public allowlist below.
location ~ ^/filearchive {
  deny all;
}

# Block web access to private storage, internal paths and upload folders
location ~ ^/(content/(tmp|cache|log|backup)|include/(config|vendor)|tests)/ {
  return 404;
}

# Block sensitive file types and development files at the document root
location ~ \.(sql|log|bak|dist)$ {
  return 404;
}

location ~ ^/(CHANGELOG|README|DEPENDENCIES|SECURITY|CODE_OF_CONDUCT|ANTIGRAVITY|CLAUDE)\.md$ {
  return 404;
}

location ~ ^/(Makefile|stacklit\.json|composer\.lock)$ {
  return 404;
}

# Only these paths are served as static files. Change them here if you
# renamed content, upload or filearchive; an unlisted directory is no
# longer reachable over HTTP.
location ~ ^/(template|img|picture|content/(form|images|rss|pages|marketing)|include/(inc_css|inc_js|inc_ext/ckeditor))(?:/|$) {
    try_files $uri =404;
}

# Use location - always start in Document Root. Existing files outside
# the allowlist above are not served: they end in the 404 below. PHP
# requests are handled by your PHP location block (for example
# location ~ \.php$ { fastcgi_pass ...; }).
location / {
# location /subfolder/ { # If installed in a subfolder

    if (!-e $request_filename){
        # Redirect /en and /en/ to english home
        rewrite "^/(en|de)(/{0,1})$" /index.php?$1/index break;

        # Resized image /img/cmsimage.php/… -> /im/…
        rewrite ^/im\/(.+?)$ /img/cmsimage.php?$1 break;

         # File download /dl/… -> /download.php?…
        rewrite ^/dl\/([a-fA-Z0-9]+)\/(.*?)$ /download.php?f=$1&$query_string break;

        # In case of config setting `$phpwcms['rewrite_ext']='.html'` -> /alias.html (Default)
        rewrite ^/(.+)\.html$ /index.php?$1&$query_string break;
        rewrite ^/([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)\.html$ /index.php?id=$1,$2,$3,$4,$5,$6&$query_string break;

        # Rewrite anything else and link it against phpwcms
        # Check redirect settings under admin in the backend
        rewrite ^/(.+)/?$ /index.php?$1&$query_string;
    }

    # Existing file or directory outside the public allowlist
    return 404;
}