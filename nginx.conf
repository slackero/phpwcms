# phpwcms nginx configuration (examples)

#include mime.types;
#types {
    # here are additional types
    #video/ogg ogv
    #video/ogg ogg
    #video/webm webm
#}

index index.html index.php;

# All 404 error should link to phpwcms then
# it is easy to define internal routing/redirection
#   error_page 404 /index.php?r404;
# Installed in Subfolder www.example.com/subfolder/
#   error_page 404 /subfolder/index.php?r404;

# Avoid accessing typical project specific IDE settings, system files, and configuration dependencies
location ~ /\.(?!well-known) {
  return 404;
}

# Private storage, internal paths and upload folders. Patterns are not anchored
# to the document root, so they also apply to installations in a subfolder.
location ~ /(content/(tmp|cache|log|backup|form)|include/(config|inc_front|inc_help|inc_lang|inc_lib)|upload|tests)(?:/|$) {
  return 404;
}

# include/inc_act hosts the browser-invoked action endpoints, so it stays
# reachable. include/inc_tmpl opens one popup only; include/inc_module serves
# its template assets and the shop API only.
location ~ /include/inc_tmpl/(?!content/cnt51\.open\.php$) {
  return 404;
}

location ~ /include/inc_module/(?!.*/template/)(?!.*/api\.shop\.php$) {
  return 404;
}

location ~ /include/build(?:/|$) {
  return 404;
}

# Vendor stays private except TinyMCE and its language packs, which the
# browser loads as editor assets straight from the vendor directory.
location ~ /include/vendor/(?!tinymce/|mklkj/tinymce-i18n/) {
  return 404;
}

location ~ /include/inc_ext/(?!ckeditor/) {
  return 404;
}

# filearchive/ is private by default and serves the direct-download option
# of file list content parts only after removing this block and adding
# filearchive to the public allowlist below.
location ~ /filearchive(?:/|$) {
  return 404;
}

# Block sensitive file types and development files
location ~ \.(sql|log|bak|dist)$ {
  return 404;
}

location ~ /(composer\.(json|lock)|package(-lock)?\.json|Dockerfile|docker-compose\.ya?ml|Makefile|phpstan\.neon(\.default)?|stacklit\.json)$ {
  return 404;
}

location ~ /(CHANGELOG|README|DEPENDENCIES|SECURITY|CODE_OF_CONDUCT|ANTIGRAVITY|CLAUDE)\.md$ {
  return 404;
}

# Never execute PHP from private or upload directories. Include this
# configuration before your PHP location block; the first matching regex
# location wins, so a PHP location declared earlier would bypass this rule.
# include/inc_act, the cnt51 popup and the shop API are browser endpoints and
# stay outside these rules.
# The negative lookahead exempts exactly one file: the cnt51 popup lives in
# include/inc_tmpl/content/ and still has to reach PHP.
location ~ ^(?!.*/include/inc_tmpl/content/cnt51\.open\.php$)(?:.*/)?(content|upload|filearchive|tests)/.*\.php$ {
  return 404;
}

location ~ /include/(config|inc_front|inc_help|inc_lang|inc_lib|vendor|inc_ext)/.*\.php$ {
  return 404;
}

location ~ /include/inc_module/(?!.*/api\.shop\.php$).*\.php$ {
  return 404;
}

# Only these paths are served as static files. Change them here if you
# renamed content, upload or filearchive; an unlisted directory is no
# longer reachable over HTTP. Root entry scripts (index.php, formfile.php, …)
# are handled by your PHP location block.
location ~ /(template|img|picture|content/(images|rss|pages|marketing)|include/(inc_css|inc_js|inc_ext/ckeditor)|setup)(?:/|$) {
    try_files $uri =404;
}

# Use location - always start in Document Root
location / {
# location /subfolder/ { # If installed in a subfolder
 
    if (!-e $request_filename){
        # Redirect /en and /en/ to english home
        rewrite "^/(en|de)(/{0,1})$" /index.php?$1/index break;
 
        # Resized image /img/cmsimage.php/… -> /im/…
        rewrite ^/im\/(.+?)$ /img/cmsimage.php?$1 break;
 
         # File download /dl/… -> /download.php?…
        rewrite ^/dl\/([a-fA-Z0-9]+)\/(.*?)$ /download.php?f=$1&$query_string break;
 
        # Specific 6-part numeric ID URLs MUST precede the generic .html rule
        rewrite ^/([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)\.p?html$ /index.php?id=$1,$2,$3,$4,$5,$6&$query_string break;

        # In case of config setting `$phpwcms['rewrite_ext']='.html'` -> /alias.html (Default)
        rewrite ^/(.+)\.p?html$ /index.php?$1&$query_string break;

        # Rewrite anything else and link it against phpwcms
        # Check redirect settings under admin in the backend
        rewrite ^/(.+)/?$ /index.php?$1&$query_string;
    }
}