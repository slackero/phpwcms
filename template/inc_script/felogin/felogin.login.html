<h3>@@Login@@</h3>

<div class="feLoginForm">

	<p>@@Please login.@@</p>
	<p>
		<small>
			@@If you have forgotten your username or your password,@@ 
			<a href="mailto:info@example.com">@@contact the administrator@@</a>.
		</small>
	</p>
	
	{FELOGIN_ERROR}

	<form action="{FELOGIN_ACTION}" method="post" name="feLoginForm" id="feLoginForm">
		<p>
			<label for="feLogin">@@Username:@@</label>
			<br />
			<input type="text" name="feLogin" id="feLogin" value="{FELOGIN_USER}" size="40" required="required" autocomplete="username" />
		</p>
		<p>
			<label for="fePassword">@@Password:@@</label>
			<br />
			<input type="password" name="fePassword" id="fePassword" size="40" required="required" autocomplete="current-password" />
		</p>
		<p>
			<input type="submit" value="@@Login@@" name="feSubmit" id="feSubmit" />
		</p>
	</form>

</div>
