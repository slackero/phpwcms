services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phpwcms-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - phpwcms_storage:/var/www/phpwcms-storage
    depends_on:
      - db
      - mailpit
      - php

  # PHP-FPM for the nginx service
  php:
    build:
      context: .
      dockerfile: Dockerfile.fpm
    container_name: phpwcms-php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - phpwcms_storage:/var/www/phpwcms-storage
    # the named volume starts as root; the workers run as www-data
    command: sh -c "mkdir -p /var/www/phpwcms-storage && chown -R www-data:www-data /var/www/phpwcms-storage && exec php-fpm"
    depends_on:
      - db
      - mailpit

  nginx:
    image: nginx:1.27-alpine
    container_name: phpwcms-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/phpwcms.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - phpwcms_storage:/var/www/phpwcms-storage:ro
    depends_on:
      - php

  db:
    image: mariadb:10.11
    container_name: phpwcms-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: phpwcms
      MYSQL_USER: phpwcms
      MYSQL_PASSWORD: phpwcmspassword
    volumes:
      - db_data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:latest
    container_name: phpwcms-mailpit
    restart: unless-stopped
    ports:
      - "8026:8025"
      - "1026:1025"
    environment:
      MP_MAX_MESSAGES: 500

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpwcms-pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

volumes:
  db_data:
  phpwcms_storage:
