server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html index.php;

    client_max_body_size 64m;

    # phpwcms rules. The include must stay before the PHP location: the
    # first matching regex location wins, and the rules deny PHP inside
    # private directories.
    include /etc/nginx/phpwcms.conf;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}
